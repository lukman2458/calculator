<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="display" style="text-align: right;"></div>
    <div class="container">
        <button class="btn leaveIt leavePlusOperator" id="AC">AC</button>
        <button class="btn leaveIt leavePlusOperator" id="back">X</button>
        <button class="btn operator leavePlusOperator" id="/">/</button>
        <button class="btn" id="7">7</button>
        <button class="btn" id="8">8</button>
        <button class="btn" id="9">9</button>
        <button class="btn operator leavePlusOperator" id="*">*</button>
        <button class="btn" id="4">4</button>
        <button class="btn" id="5">5</button>
        <button class="btn" id="6">6</button>
        <button class="btn operator leavePlusOperator" id="-">-</button>
        <button class="btn" id="1">1</button>
        <button class="btn" id="2">2</button>
        <button class="btn" id="3">3</button>
        <button class="btn operator leavePlusOperator" id="+">+</button>
        <button class="btn operator leavePlusOperator" id="%">%</button>
        <button class="btn" id="0">0</button>
        <button class="btn " id=".">.</button>
        <button class="btn leaveIt leavePlusOperator" id="=">=</button>
    </div>
</body>
</html>
