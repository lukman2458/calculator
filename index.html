<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="fullBody">
        <div class="display" style="text-align: right;"></div>
        <div class="container">
            <button class="btn leaveIt leavePlusOperator opStyle" id="AC">AC</button>
            <button class="btn opStyle" id="back"><img src="assets/Wrong.png" alt="" width="50px" ></button>
            <button></button>
            <button class="btn operator leavePlusOperator" id="/">/</button>
            <button class="btn numbtn" id="7">7</button>
            <button class="btn numbtn" id="8">8</button>
            <button class="btn numbtn" id="9">9</button>
            <button class="btn operator leavePlusOperator" id="*">*</button>
            <button class="btn numbtn" id="4">4</button>
            <button class="btn numbtn" id="5">5</button>
            <button class="btn numbtn" id="6">6</button>
            <button class="btn operator leavePlusOperator" id="-">-</button>
            <button class="btn numbtn" id="1">1</button>
            <button class="btn numbtn" id="2">2</button>
            <button class="btn numbtn" id="3">3</button>
            <button class="btn operator leavePlusOperator" id="+">+</button>
            <button class="btn operator leavePlusOperator" id="%">%</button>
            <button class="btn numbtn" id="0">0</button>
            <button class="btn opStyle" id=".">.</button>
            <button class="btn leaveIt leavePlusOperator equal" id="=">=</button>
        </div>
    </div>
</body>

</html>
