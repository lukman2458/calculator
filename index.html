<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button class="btn" id="AC">AC</button>
        <button class="btn" id="back">X</button>
        <button class="btn operator" id="/">/</button>
        <button class="btn numbtn" id="7">7</button>
        <button class="btn numbtn" id="8">8</button>
        <button class="btn numbtn" id="9">9</button>
        <button class="btn operator" id="*">*</button>
        <button class="btn numbtn" id="4">4</button>
        <button class="btn numbtn" id="5">5</button>
        <button class="btn numbtn" id="6">6</button>
        <button class="btn operator" id="-">-</button>
        <button class="btn numbtn" id="1">1</button>
        <button class="btn numbtn" id="2">2</button>
        <button class="btn numbtn" id="3">3</button>
        <button class="btn operator" id="+">+</button>
        <button class="btn operator" id="%">%</button>
        <button class="btn numbtn" id="0">0</button>
        <button class="btn " id=".">.</button>
        <button class="btn" id="=">=</button>
    </div>
</body>
</html>
